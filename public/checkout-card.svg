<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Social Downloader Pro">
  <!--
    The product image on the Creem checkout, and nothing else.

    It exists because the checkout was showing favicon.svg, which is a 32px
    tab icon: at the ~450px the checkout renders it, a mark drawn to survive
    at 16px reads as a blown-up glyph on a grey plate. This is the same art
    at the scale it was drawn for, sitting on the app's own background, so
    the tile is the subject rather than the whole picture.

    Square on purpose. The checkout contains the image on a light plate, so
    any other aspect ratio letterboxes into grey bars down two sides.

    No text: the checkout prints "Social Downloader Pro" immediately above
    this, and an SVG wordmark would render in whatever font the buyer's
    browser happens to have.

    Deliberately flat. No outer glow, no blur filter, no animation: this is
    fetched and rasterised by a third party we do not control, so it uses
    only the primitives every renderer agrees on.
  -->
  <defs>
    <linearGradient id="tile" x1="192" y1="192" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" />
      <stop offset="0.5" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Vertical lift on the backdrop, the same trick the site's own
         background uses, so the tile does not float on a flat slab. -->
    <linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12161c" />
      <stop offset="1" stop-color="#08090c" />
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#backdrop)" />

  <!-- Inner hairline rather than a drop shadow: the checkout plate behind
       this is light, so an outer shadow would read as a dirty edge. -->
  <rect x="0.5" y="0.5" width="639" height="639" fill="none" stroke="#ffffff" stroke-opacity="0.07" />

  <!-- Tinted contact shadow, brand hue rather than black, sized to sit just
       under the tile so the tile looks placed on the surface. -->
  <ellipse cx="320" cy="466" rx="118" ry="16" fill="#22d3ee" fill-opacity="0.16" />

  <!-- 256 of 640 = 40%. The tile is the subject and the field around it is
       what stops this reading as an icon blown up to fill a box. rx keeps
       the 7.5/32 corner ratio of the app mark exactly. -->
  <rect x="192" y="192" width="256" height="256" rx="60" fill="url(#tile)" />

  <!-- The app mark, unchanged: GLYPH_MARK in src/lib/appIcon.tsx and
       public/favicon.svg are the same two paths. Drawn in 32-unit space, so
       the 5.44 offset and 0.66 glyph scale are multiplied by 8 to land in
       the 256-unit tile above. -->
  <g fill="#08080a" transform="translate(235.52 235.52) scale(5.28)">
    <path d="M5.65 2.2H26.35Q30 2.2 27.78 5.09L17.74 18.13Q16 20.4 14.26 18.13L4.22 5.09Q2 2.2 5.65 2.2Z" />
    <rect x="6" y="24.8" width="20" height="5" rx="2.5" />
  </g>
</svg>
