name: SoundCloud API probe

# Manual verification of the SoundCloud resolver pattern against real
# datacenter egress before any extractor code is written from the findings.
# GitHub-hosted runners share the Worker's vantage class (datacenter IP), so a
# pass here is the evidence the verify-before-code rule wants - and a refusal
# on any step is the verdict, recorded the same way the 2026-10-20 SoundCloud
# 422 was.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Track URL (defaults to the SoundCloud-documented example)'
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe the API-v2 pattern
        run: node scripts/soundcloud-api-probe.mjs "${{ github.event.inputs.track || 'https://soundcloud.com/forss/flickermood' }}"
